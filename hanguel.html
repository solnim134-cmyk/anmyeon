<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세종의 편지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0906; --ink2:#17110b; --ink3:#241a11;
  --paper:#ecdfc3; --paper2:#d8c299; --paper3:#b99a68; --pink:#2a1c10;
  --red:#9e1f1c; --red2:#c2382f; --gold:#c9a45a; --gold2:#ecd395; --jade:#7fae9a;
  --blue:#2f5fae; --muted:#a8957a;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --title:"Nanum Myeongjo","Noto Serif KR",serif;
  --brush:"East Sea Dokdo","Nanum Myeongjo",serif;
  --glyph:"Noto Serif KR","Nanum Myeongjo",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--serif);overflow:hidden;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.75) 100%),
  radial-gradient(circle at 6% 92%,rgba(255,170,70,.16),transparent 30%)}
.candle{position:fixed;left:2.2vw;bottom:2vh;width:90px;height:200px;z-index:0;pointer-events:none;opacity:.9;transition:.6s;transform-origin:bottom left}
body.playing .candle{opacity:.45;transform:scale(.6);left:4px;bottom:0}
.candle .flame{position:absolute;left:36px;top:30px;width:18px;height:40px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fff6c8 0%,#ffcf5c 35%,#ff8a1f 70%,transparent 72%);
  filter:blur(.4px);animation:flick 1.6s infinite ease-in-out;transform-origin:50% 100%}
.candle .glow{position:absolute;left:-60px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,180,80,.35),transparent 60%);animation:glow 2.4s infinite ease-in-out}
.candle .body{position:absolute;left:30px;top:68px;width:30px;height:110px;border-radius:4px 4px 2px 2px;
  background:linear-gradient(90deg,#d9c8a4,#f3e8cf 40%,#c9b48b)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}25%{transform:scale(.92,1.08) rotate(2deg)}50%{transform:scale(1.05,.95) rotate(-1deg)}75%{transform:scale(.96,1.04) rotate(1.5deg)}}
@keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}

/* ---------- HUD ---------- */
#app{position:relative;z-index:5;height:100vh;display:grid;grid-template-rows:auto 1fr}
#hud{display:none;align-items:center;gap:18px;padding:10px 20px;background:linear-gradient(180deg,rgba(10,7,4,.95),rgba(10,7,4,.6));border-bottom:1px solid rgba(201,164,90,.25)}
body.playing #hud{display:flex}
.who{font-family:var(--title);font-weight:700;font-size:15px;color:var(--gold2);white-space:nowrap}
.who small{color:var(--muted);font-weight:400;margin-right:6px}
.journey{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.jn{display:flex;align-items:center;gap:6px;font-size:13px;color:#6f6252;white-space:nowrap}
.jn b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid #4a3d2e;font-family:var(--title);font-size:12px}
.jn.on{color:var(--gold2)} .jn.on b{border-color:var(--gold);background:rgba(201,164,90,.18);box-shadow:0 0 12px rgba(201,164,90,.5)}
.jn.done{color:#b9a888} .jn.done b{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.jline{width:22px;height:1px;background:#4a3d2e}
.lamps{display:flex;gap:3px;align-items:center}
.lamp{width:14px;height:22px;position:relative}
.lamp::before{content:"";position:absolute;left:3px;top:0;width:8px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff3c2,#ffb43a 60%,transparent 64%)}
.lamp::after{content:"";position:absolute;left:4px;top:12px;width:6px;height:10px;background:#d9c8a4;border-radius:1px}
.lamp.off::before{background:none;border:1px dashed #5b4c3a}
.lamp.off::after{background:#5b4c3a}
.timer{font-family:var(--title);font-size:14px;color:var(--muted);min-width:48px;text-align:right}
.iconbtn{background:transparent;border:1px solid #4a3d2e;color:var(--paper2);border-radius:8px;padding:6px 10px;font-size:13px}
.iconbtn:hover{border-color:var(--gold);color:var(--gold2)}

#body{display:grid;grid-template-columns:1fr 250px;min-height:0}
body:not(.playing) #body{grid-template-columns:1fr}
body:not(.playing) #side{display:none}
#stage{position:relative;min-height:0;overflow:auto;padding:18px 22px;display:flex;align-items:center;justify-content:center}
#side{border-left:1px solid rgba(201,164,90,.18);background:rgba(8,6,4,.55);padding:18px 16px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.side-h{font-family:var(--title);font-weight:800;font-size:13px;color:var(--gold);letter-spacing:.12em;margin-bottom:8px}
.quest{background:rgba(236,223,195,.06);border:1px solid rgba(201,164,90,.25);border-radius:10px;padding:12px}
.quest .qt{font-family:var(--title);font-weight:700;color:var(--gold2);font-size:15px;margin-bottom:6px}
.quest .qd{font-size:13.5px;line-height:1.6;color:#d8c9ac}
.pieces{display:flex;flex-direction:column;gap:8px}
.piece{border:1px dashed #4f4232;border-radius:8px;padding:9px 10px;font-size:13.5px;color:#6a5c4a;display:flex;gap:8px;align-items:center;min-height:42px}
.piece i{font-style:normal;font-family:var(--title);font-weight:800;color:#5b4c3a;width:18px}
.piece.got{border-style:solid;border-color:var(--gold);color:var(--paper);background:linear-gradient(90deg,rgba(201,164,90,.18),rgba(201,164,90,.04));box-shadow:0 0 14px rgba(201,164,90,.15)}
.piece.got i{color:var(--gold2)}
.piece.new{animation:pieceIn 1.2s ease}
@keyframes pieceIn{0%{transform:scale(1.15);box-shadow:0 0 40px rgba(236,211,149,.9)}100%{transform:none}}
.side-note{font-size:12px;color:#7d6e5a;line-height:1.6;margin-top:auto}

/* ---------- common ---------- */
.btn{border:none;border-radius:10px;padding:12px 26px;font-size:17px;font-family:var(--title);font-weight:800;letter-spacing:.02em;transition:.15s}
.btn.primary{background:linear-gradient(180deg,#b3302a,#86191a);color:#fbe9cf;box-shadow:0 4px 0 #5a0f0f,0 8px 22px rgba(0,0,0,.4)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #5a0f0f}
.btn.ghost{background:transparent;color:var(--paper2);border:1px solid var(--paper3)}
.btn.ghost:hover{border-color:var(--gold2);color:var(--gold2)}
.btn.gold{background:linear-gradient(180deg,#e5c77f,#b78f3f);color:#2b1c0c;box-shadow:0 4px 0 #6e5320}
.btn:disabled{opacity:.35;cursor:default}
.fade-in{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.paper{position:relative;color:var(--pink);border-radius:6px;
  background:
   radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 50%),
   radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.18),transparent 55%),
   linear-gradient(180deg,#efe3c8,#e3d0aa);
  box-shadow:inset 0 0 50px rgba(110,70,25,.45),inset 0 0 8px rgba(80,50,15,.4),0 18px 50px rgba(0,0,0,.6)}
.paper::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.paper.black{color:#e8dcc4;background:radial-gradient(ellipse at 50% 30%,#2a2119,#0f0b08 75%);box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 0 1px rgba(201,164,90,.15),0 18px 50px rgba(0,0,0,.7)}
.paper.black::before{opacity:.25;mix-blend-mode:screen}
.paper.blue{color:#f4ead2;background:radial-gradient(ellipse at 50% 20%,#24406e,#0f1a2e 80%);box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 0 0 1px rgba(236,211,149,.4),0 0 60px rgba(236,211,149,.18)}
.paper.blue::before{opacity:.18;mix-blend-mode:screen}

/* ---------- title ---------- */
.title-scene{position:relative;width:100%;height:100%;display:grid;place-items:center}
.title-art{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.title-art img{position:absolute;bottom:0;height:96%;object-fit:cover}
.title-art .t-sejong{left:2%;opacity:.55;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 95%),linear-gradient(0deg,transparent,#000 25%);-webkit-mask-composite:source-in;mask-image:radial-gradient(ellipse 60% 60% at 50% 45%,#000 40%,transparent 75%);filter:sepia(.3) brightness(.75)}
.title-art .t-shadow{right:0;opacity:.6;mask-image:radial-gradient(ellipse 60% 60% at 50% 45%,#000 35%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 45%,#000 35%,transparent 75%)}
.title-card{position:relative;width:min(620px,92vw);padding:34px 44px 30px;text-align:center}
.tag{font-family:var(--title);font-weight:700;font-size:16px;letter-spacing:.15em;color:#5b3c1f}
.big-title{font-family:var(--brush);font-size:clamp(76px,10vw,124px);line-height:.95;margin:8px 0 2px;color:#1c120a;letter-spacing:.02em}
.big-title span{color:var(--red)}
.seal{display:inline-grid;grid-template-columns:1fr 1fr;width:46px;height:46px;border:2px solid var(--red);color:var(--red);font-family:var(--glyph);font-weight:900;font-size:17px;line-height:20px;padding:1px;border-radius:3px;vertical-align:top;margin-left:8px;transform:rotate(4deg);background:rgba(158,31,28,.06)}
.subtitle{font-family:var(--title);font-weight:800;font-size:20px;color:#2b1d12;margin-bottom:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#8f6e43,transparent);margin:12px 0}
.intro-text{font-size:15px;line-height:1.75;color:#3e2b18;margin-bottom:16px}
.form{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.form label{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-family:var(--title);font-weight:700;font-size:13px;color:#5b3c1f}
.form input{width:150px;padding:10px 12px;font-size:18px;font-family:var(--serif);border:1.5px solid #9f7f52;border-radius:8px;background:rgba(255,250,238,.7);color:#20140a;outline:none}
.form input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(158,31,28,.15)}
.form .w-name input{width:170px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-bottom:6px}
.meta{margin-top:14px;font-size:13px;color:#6b5236;line-height:1.6}
.resume{margin-top:10px;font-size:14px}
.resume button{background:none;border:none;color:var(--red);text-decoration:underline;font-size:14px;font-family:var(--serif)}

/* ---------- letter ---------- */
.letter-scene{display:flex;gap:26px;align-items:center;justify-content:center;width:100%;max-width:1060px}
.portrait{flex:0 0 auto;width:min(300px,28vw);position:relative;margin:0}
.portrait img{width:100%;display:block;max-height:68vh;object-fit:cover;object-position:top;
  -webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 42%,#000 55%,transparent 80%);mask-image:radial-gradient(ellipse 70% 72% at 50% 42%,#000 55%,transparent 80%)}
.portrait figcaption{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:var(--title);font-weight:800;font-size:17px;color:var(--gold2);text-shadow:0 2px 10px #000,0 0 3px #000}
.portrait.unknown img{filter:brightness(.25) contrast(1.4)}
.portrait.unknown figcaption{color:#9a8c78;letter-spacing:.3em}
.portrait.shadow img{animation:breath 5s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.letter{flex:1;max-width:640px;padding:30px 38px 22px;max-height:calc(100vh - 140px);display:flex;flex-direction:column}
.l-title{font-family:var(--title);font-weight:800;font-size:15px;letter-spacing:.14em;opacity:.8;margin-bottom:12px}
.paper:not(.black):not(.blue) .l-title{color:var(--red)}
.paper.black .l-title{color:#b8a789}
.paper.blue .l-title{color:var(--gold2)}
.l-body{flex:1;overflow:auto;font-size:18px;line-height:1.85;min-height:120px;cursor:pointer;padding-right:6px}
.l-body p{min-height:.9em}
.l-body p.emph{font-family:var(--title);font-weight:800;font-size:21px}
.paper:not(.black):not(.blue) .l-body p.emph{color:var(--red)}
.paper.black .l-body p.emph{color:#f1d9a6}
.paper.blue .l-body p.emph{color:var(--gold2)}
.l-body .caret{display:inline-block;width:2px;height:1em;background:currentColor;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.l-from{text-align:right;font-family:var(--title);font-weight:800;font-size:17px;margin-top:8px;opacity:0;transition:.6s}
.l-from.show{opacity:1}
.l-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.l-skip{font-size:12.5px;opacity:.55}

/* ---------- mission frame ---------- */
.mission{width:100%;max-width:1040px}
.m-head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.m-no{font-family:var(--title);font-weight:800;color:var(--gold);font-size:14px;letter-spacing:.2em}
.m-title{font-family:var(--title);font-weight:800;font-size:24px;color:var(--paper)}
.m-desc{font-size:15.5px;color:#cdbd9f;line-height:1.6;margin-bottom:14px}
.m-panel{padding:22px 24px}
.m-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
.feedback{font-size:15.5px;min-height:24px;color:var(--gold2);line-height:1.5}
.feedback.bad{color:#ff9d86}

/* M1 */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.slot{min-height:150px;border:2px dashed rgba(90,60,30,.45);border-radius:10px;position:relative;display:flex;align-items:stretch;padding:4px}
.slot::before{content:attr(data-n);position:absolute;top:-11px;left:10px;background:#e7d7b5;padding:0 6px;font-family:var(--title);font-weight:800;font-size:13px;color:#7a5530}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:150px}
.ecard{width:180px;min-height:140px;perspective:800px;cursor:pointer}
.slot .ecard{width:100%}
.ecard .in{position:relative;width:100%;height:100%;min-height:138px;transition:transform .8s;transform-style:preserve-3d}
.ecard.flip .in{transform:rotateY(180deg)}
.ecard .f,.ecard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px}
.ecard .f{background:linear-gradient(180deg,#fbf3e1,#eadbb9);border:1px solid #b39466;color:#2b1d12;font-size:15px;line-height:1.55;box-shadow:0 3px 8px rgba(60,35,10,.25)}
.ecard:hover .f{border-color:var(--red)}
.ecard.lock .f{border:2px solid #4b8a62;background:linear-gradient(180deg,#f3f6e6,#dfe8cc)}
.ecard .b{transform:rotateY(180deg);background:radial-gradient(circle,#2a1d12,#120c07);border:1px solid var(--gold);font-family:var(--brush);font-size:84px;color:var(--gold2);text-shadow:0 0 20px rgba(236,211,149,.5)}

/* M2 */
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;min-height:58px}
.tile{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-family:var(--glyph);font-weight:900;font-size:36px;color:#2b1d12;background:linear-gradient(180deg,#fbf3e1,#e2cfa6);border:1.5px solid #9f7f52;box-shadow:0 3px 0 #8b6a3e;cursor:grab;transition:.12s}
.tile:hover{transform:translateY(-2px)}
.tile.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(194,56,47,.5),0 3px 0 #8b6a3e;transform:translateY(-3px)}
.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.targets.v{grid-template-columns:repeat(3,1fr);max-width:620px;margin:10px auto 0}
.row-label{font-family:var(--title);font-weight:800;font-size:13px;color:#7a5530;margin:4px 0 6px;letter-spacing:.1em}
.target{border:1.5px solid #b39466;border-radius:10px;background:rgba(255,250,236,.55);padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.15s;position:relative}
.target:hover{border-color:var(--red);background:rgba(255,250,236,.85)}
.target.drag{border-color:var(--red);box-shadow:0 0 0 3px rgba(194,56,47,.3)}
.target svg{width:72px;height:48px}
.target .lab{font-size:13.5px;line-height:1.35;text-align:center;color:#3e2b18;min-height:20px;display:flex;align-items:center}
.target .slotg{width:40px;height:40px;border:1.5px dashed #a98a5c;border-radius:8px;display:grid;place-items:center;font-family:var(--glyph);font-weight:900;font-size:30px;color:#20140a}
.target.ok{border-color:#4b8a62;background:rgba(232,242,220,.85);cursor:default}
.target.ok .slotg{border:2px solid #4b8a62;background:#fff}
.reveal{display:flex;justify-content:center;gap:8px;margin-top:10px}
.rv{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-family:var(--brush);font-size:46px;background:#16100a;color:transparent;border:1px solid #4a3d2e;transition:.6s}
.rv.on{color:#f0dcae;border-color:var(--gold);text-shadow:0 0 14px rgba(236,211,149,.6)}

/* M3 */
.book-wrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.book{width:270px;height:360px;border-radius:4px 12px 12px 4px;position:relative;
  background:linear-gradient(90deg,#3b2a1a 0 14px,#6b4c2c 14px 16px,#8a6a43 16px,#7a5b37);box-shadow:inset -10px 0 30px rgba(0,0,0,.4),0 20px 40px rgba(0,0,0,.6)}
.book .label{position:absolute;right:46px;top:36px;width:62px;height:220px;background:#efe2c4;border:2px solid #3b2a1a;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-family:var(--glyph);font-weight:900;font-size:26px;letter-spacing:.15em;color:#20140a}
.book .label .q{color:var(--red)}
.book .thread{position:absolute;left:4px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,transparent 0 50px,#d9c8a4 50px 54px)}
.chain{position:absolute;left:-14px;right:-14px;top:50%;height:16px;transform:translateY(-50%) rotate(-8deg);background:repeating-linear-gradient(90deg,#5d5a55 0 12px,#8f8a80 12px 16px,#3a3834 16px 22px);border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.6);transition:.8s}
.book.open .chain{opacity:0;transform:translateY(80px) rotate(10deg)}
.padlock{background:linear-gradient(180deg,#2b241c,#16110c);border:1px solid #6e5a3d;border-radius:14px;padding:18px 20px;text-align:center;min-width:320px}
.padlock .ins{font-size:14.5px;color:#d7c6a5;margin-bottom:12px;line-height:1.6}
.dials{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:52px;height:30px;background:#3a2e22;border:1px solid #6e5a3d;color:var(--gold2);border-radius:6px;font-size:14px}
.dial button:hover{background:#4d3d2c}
.dial .d{width:52px;height:64px;display:grid;place-items:center;background:linear-gradient(180deg,#d4c09a,#f4e9d1 45%,#c7b088);border-radius:6px;font-family:var(--title);font-weight:800;font-size:36px;color:#20140a;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.clues{list-style:none;display:flex;flex-direction:column;gap:9px;margin:4px 0 16px}
.clues li{padding:10px 14px;border-left:3px solid var(--red);background:rgba(255,250,236,.55);border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.5}
.namebox{display:flex;align-items:center;gap:8px;font-family:var(--title);font-weight:800;font-size:24px;justify-content:center;margin:6px 0}
.namebox input{width:110px;text-align:center;font-size:24px;font-family:var(--title);font-weight:800;padding:6px;border:2px solid #9f7f52;border-radius:8px;background:#fffaf0;color:var(--red);outline:none}

/* M4 */
.clue-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.ccard{min-height:94px;border-radius:10px;border:1.5px dashed #a98a5c;display:flex;flex-direction:column;justify-content:center;padding:12px 14px;font-size:15.5px;line-height:1.5;color:#3e2b18;background:rgba(255,250,236,.4)}
.ccard b{font-family:var(--title);color:var(--red);font-size:13px;letter-spacing:.1em;margin-bottom:4px}
.ccard.hide{color:transparent;background:repeating-linear-gradient(45deg,rgba(120,90,50,.15) 0 8px,transparent 8px 16px)}
.ccard.hide b{color:#a98a5c}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{border-radius:12px;border:1.5px solid #9f7f52;background:linear-gradient(180deg,#fbf3e1,#e2cfa6);padding:16px 10px;text-align:center;cursor:pointer;transition:.15s;color:#2b1d12}
.person:hover:not(:disabled){transform:translateY(-3px);border-color:var(--red);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.person .pn{font-family:var(--title);font-weight:800;font-size:24px}
.person .pd{font-size:13px;color:#6b5236;margin-top:4px}
.person .pi{font-family:var(--brush);font-size:42px;color:var(--red);opacity:.8;line-height:1}
.person:disabled{opacity:.35;cursor:default;filter:grayscale(1)}
.person.right{border-color:#4b8a62;box-shadow:0 0 0 3px rgba(75,138,98,.35);opacity:1;filter:none}
.bio{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.bio .stamp{width:120px;height:150px;border:2px solid var(--red);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:var(--brush);font-size:46px;line-height:1.05;background:rgba(158,31,28,.05)}
.bio .stamp small{font-family:var(--title);font-size:13px;font-weight:700;margin-top:8px}
.bio ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.bio li{font-size:15.5px;line-height:1.55;padding-left:18px;position:relative}
.bio li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--red);transform:rotate(45deg)}
.bio li b{font-family:var(--title)}

/* ---------- battle ---------- */
.battle{width:100%;max-width:980px}
.arena{position:relative;height:300px;border-radius:14px;overflow:hidden;border:1px solid rgba(201,164,90,.25);
  background:radial-gradient(ellipse at 70% 60%,rgba(80,60,40,.35),transparent 60%),linear-gradient(180deg,#120d09,#1e160f 70%,#0d0906)}
.arena .floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,transparent,rgba(201,164,90,.08));border-top:1px solid rgba(201,164,90,.12)}
.hero{position:absolute;left:8%;bottom:40px;width:150px;text-align:center}
.hero .brush{width:110px;height:150px;margin:0 auto;display:block;filter:drop-shadow(0 0 16px rgba(236,211,149,.35))}
.hero .nm{font-family:var(--title);font-weight:800;color:var(--gold2);font-size:14px}
.mon{position:absolute;right:14%;top:26px;width:260px;height:230px;transition:opacity 1.2s,filter 1.2s,transform .2s}
.mon .blob{position:absolute;border-radius:50%;filter:blur(18px);animation:drift 6s ease-in-out infinite}
.mon .eyes{position:absolute;left:50%;top:40%;transform:translateX(-50%);display:flex;gap:26px}
.mon .eyes i{width:22px;height:9px;background:var(--mcol,#ffd98a);border-radius:50% 50% 40% 40%/80% 80% 20% 20%;box-shadow:0 0 14px var(--mcol,#ffd98a),0 0 30px var(--mcol,#ffd98a);animation:blinkEye 4s infinite}
.mon .frag{position:absolute;font-family:var(--glyph);font-weight:900;color:rgba(236,223,195,.35);animation:floaty 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(10px,-8px) scale(1.06)}66%{transform:translate(-8px,6px) scale(.96)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mon.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(16px);filter:brightness(2.4)}50%{transform:translateX(-8px)}}
.mon.dead{opacity:0;filter:blur(20px) brightness(2);transform:scale(1.3)}
.mon-ui{position:absolute;right:6%;top:14px;text-align:right}
.mon-ui .mn{font-family:var(--title);font-weight:800;font-size:18px;color:#efe0c0}
.mon-ui .ms{font-size:12.5px;color:var(--muted)}
.hp{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.hp i{width:44px;height:8px;border-radius:4px;background:#8f2a20;box-shadow:0 0 8px rgba(194,56,47,.6);transition:.5s}
.hp i.gone{background:#2e241b;box-shadow:none}
.slash{position:absolute;right:14%;top:30px;width:260px;height:220px;pointer-events:none}
.slash path{fill:none;stroke:#f3dc9b;stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 10px #ffd77a);stroke-dasharray:420;stroke-dashoffset:420}
.slash.go path{animation:slash .45s ease-out forwards}
@keyframes slash{to{stroke-dashoffset:0}}
.floattxt{position:absolute;font-family:var(--title);font-weight:800;font-size:22px;color:var(--gold2);text-shadow:0 0 10px #000;animation:upfade 1.3s ease-out forwards;pointer-events:none}
.floattxt.bad{color:#ff8f78}
@keyframes upfade{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
.redflash{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,transparent 40%,rgba(160,20,10,.55));animation:rf .6s forwards}
@keyframes rf{from{opacity:1}to{opacity:0}}
.qbox{margin-top:14px;padding:18px 22px}
.qtext{font-family:var(--title);font-weight:800;font-size:19px;margin-bottom:12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid #a98a5c;background:rgba(255,250,236,.7);font-size:16px;color:#2b1d12;line-height:1.45;font-family:var(--serif);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--red);background:#fffaf0;transform:translateX(2px)}
.opt:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.opt.right{border-color:#4b8a62;background:#e8f2dc;opacity:1;text-decoration:none}
.qhint{margin-top:10px;font-size:14.5px;color:#7a2d1d;min-height:20px}
.victory{text-align:center}
.victory h3{font-family:var(--title);font-weight:800;font-size:22px;color:var(--red);margin-bottom:10px}
.recap{list-style:none;text-align:left;display:flex;flex-direction:column;gap:6px;margin:0 auto 6px;max-width:680px}
.recap li{font-size:15px;line-height:1.55;padding:8px 12px;background:rgba(255,250,236,.55);border-radius:8px}
.recap li b{color:var(--red);font-family:var(--title)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,3,2,.78);backdrop-filter:blur(3px);animation:fadeIn .4s}
.piece-pop{text-align:center;padding:36px 46px;min-width:420px}
.piece-pop .pk{font-family:var(--title);font-weight:800;color:var(--gold);letter-spacing:.2em;font-size:14px;margin-bottom:10px}
.piece-pop .scroll{font-family:var(--brush);font-size:62px;color:var(--gold2);text-shadow:0 0 24px rgba(236,211,149,.6);margin:6px 0 16px;animation:glowTxt 2s infinite}
@keyframes glowTxt{50%{text-shadow:0 0 40px rgba(236,211,149,.9)}}
.rays{position:absolute;width:520px;height:520px;left:50%;top:50%;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(236,211,149,.12) 0 8deg,transparent 8deg 22deg);border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000,transparent 65%);mask-image:radial-gradient(circle,#000,transparent 65%);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.modal{padding:26px 30px;text-align:center;max-width:420px}
.modal p{font-size:16.5px;line-height:1.7;margin-bottom:18px}
.modal .row{display:flex;gap:10px;justify-content:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;padding:12px 20px;border-radius:10px;background:rgba(20,14,9,.95);border:1px solid var(--gold);color:var(--gold2);font-size:15px;opacity:0;transition:.4s;pointer-events:none;max-width:80vw;text-align:center;line-height:1.5}
#toast.show{opacity:1}

/* truth */
.truth{position:relative;width:100%;max-width:1060px;display:flex;gap:26px;align-items:center;justify-content:center}
.morph{position:relative;width:min(330px,30vw);aspect-ratio:3/4;flex:0 0 auto}
.morph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 2.4s,filter 2.4s,transform 2.4s;
  -webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 45%,#000 55%,transparent 80%);mask-image:radial-gradient(ellipse 70% 72% at 50% 45%,#000 55%,transparent 80%)}
.morph .g{opacity:0;filter:brightness(2) blur(10px);transform:scale(.96)}
.morph.done .s{opacity:0;filter:blur(16px) brightness(.2);transform:scale(1.1)}
.morph.done .g{opacity:1;filter:none;transform:none}
.morph .cap{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:var(--title);font-weight:800;font-size:18px;color:var(--gold2);text-shadow:0 2px 10px #000;transition:1s}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px #ffd36b;animation:spark 2.4s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

/* finale */
.assemble{display:flex;flex-direction:column;gap:12px;align-items:center;margin:8px 0 18px}
.assemble .ln{font-family:var(--brush);font-size:46px;color:var(--gold2);text-shadow:0 0 18px rgba(236,211,149,.4);opacity:0;transform:translateY(16px);transition:1s}
.assemble .ln.on{opacity:1;transform:none}
.reply{padding:28px 34px;max-width:720px;width:100%}
.reply h3{font-family:var(--title);font-weight:800;font-size:22px;text-align:center;color:var(--red);margin-bottom:6px}
.reply .sub{text-align:center;font-size:14.5px;color:#5b3c1f;margin-bottom:18px}
.reply .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:21px;font-family:var(--title);font-weight:700;justify-content:center;margin:10px 0}
.reply input{font-size:19px;font-family:var(--serif);padding:8px 12px;border:none;border-bottom:2px solid #8f6e43;background:rgba(255,250,236,.6);width:260px;outline:none;color:#20140a;border-radius:6px 6px 0 0}
.reply input:focus{border-bottom-color:var(--red);background:#fffaf0}
.preview{margin:16px auto 6px;text-align:center;font-size:18px;line-height:1.6;color:#2b1d12;padding:12px;border:1px dashed #a98a5c;border-radius:8px;min-height:54px}
.preview em{font-style:normal;color:var(--red);font-weight:700}

/* end */
.end{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;max-width:1060px;width:100%}
.end canvas{height:min(72vh,640px);width:auto;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.7)}
.end-info h2{font-family:var(--brush);font-size:64px;color:var(--gold2);line-height:1;margin-bottom:6px}
.end-info .q{font-family:var(--title);font-weight:700;font-size:18px;color:var(--paper);margin-bottom:18px}
.end-info .box{border:1px solid rgba(201,164,90,.35);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:rgba(236,223,195,.05)}
.end-info .box b{font-family:var(--title);color:var(--gold2)}
.end-info .box p{font-size:15px;line-height:1.7;color:#d8c9ac}
.end-info .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

@media (max-width:1100px){
  #body{grid-template-columns:1fr}
  #side{display:none}
  .jn span{display:none}
}
@media (max-width:820px){
  .letter-scene,.truth{flex-direction:column}
  .portrait,.morph{width:200px}
  .slots,.targets{grid-template-columns:repeat(2,1fr)}
  .people,.clue-cards,.opts{grid-template-columns:1fr 1fr}
  .end{grid-template-columns:1fr}
}
</style>
</head>

</div>

/* ================= 오디오 ================= */
const Snd = (() => {
  let ctx, master, bgm, sfx, rev, revSend, droneG, timer, nextT = 0, mode = 'calm', on = true, idx = 4, step = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = {
    calm:   [55,57,60,62,64,67,69,72,74,76],
    tense:  [52,55,57,59,62,64,67,69],
    battle: [57,60,62,64,67,69,72,74],
    bright: [60,62,64,67,69,72,74,76,79,81]
  };
  const TEMPO = {calm:.62, tense:.8, battle:.28, bright:.45};
  try { on = localStorage.getItem('sejong_sound') !== 'off'; } catch(e) {}
  function impulse(sec){
    const len = ctx.sampleRate*sec, b = ctx.createBuffer(2,len,ctx.sampleRate);
    for (let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    return b;
  }
  function init(){
    if (ctx) { if (ctx.state==='suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
    master = ctx.createGain(); master.gain.value = on ? .85 : 0; master.connect(ctx.destination);
    bgm = ctx.createGain(); bgm.gain.value = .32; bgm.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = .6; sfx.connect(master);
    rev = ctx.createConvolver(); rev.buffer = impulse(2.8); rev.connect(master);
    revSend = ctx.createGain(); revSend.gain.value = .5; revSend.connect(rev);
    // drone
    droneG = ctx.createGain(); droneG.gain.value = .0;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
    droneG.connect(lp); lp.connect(bgm); lp.connect(revSend);
    [43,50,55].forEach((m,i)=>{const o=ctx.createOscillator();o.type=i==2?'triangle':'sine';o.frequency.value=mtof(m);
      const g=ctx.createGain();g.gain.value=i==2?.12:.3;o.connect(g);g.connect(droneG);o.start();
      const l=ctx.createOscillator();l.frequency.value=.07+i*.03;const lg=ctx.createGain();lg.gain.value=.12;l.connect(lg);lg.connect(g.gain);l.start();});
    droneG.gain.linearRampToValueAtTime(.16, ctx.currentTime+3);
    nextT = ctx.currentTime + .3;
    timer = setInterval(sched, 90);
  }
  function pluck(f, t, vol=.22, dur=1.8, dest){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f1 = ctx.createBiquadFilter();
    o.type='triangle'; o2.type='sine';
    o.frequency.setValueAtTime(f*1.03,t); o.frequency.exponentialRampToValueAtTime(f,t+.06);
    o2.frequency.setValueAtTime(f*2,t);
    // 농현 느낌의 살짝 흔들림
    const v=ctx.createOscillator(), vg=ctx.createGain(); v.frequency.value=5.2; vg.gain.setValueAtTime(0,t); vg.gain.linearRampToValueAtTime(f*.012,t+.5);
    v.connect(vg); vg.connect(o.frequency);
    f1.type='lowpass'; f1.frequency.setValueAtTime(f*6,t); f1.frequency.exponentialRampToValueAtTime(f*1.5,t+dur*.6);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    const g2=ctx.createGain(); g2.gain.value=.25;
    o.connect(f1); o2.connect(g2); g2.connect(f1); f1.connect(g);
    g.connect(dest||bgm); g.connect(revSend);
    [o,o2,v].forEach(x=>{x.start(t);x.stop(t+dur+.05);});
  }
  function buk(t, vol=.5, dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+.18);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.45);
    o.connect(g); g.connect(dest||bgm); o.start(t); o.stop(t+.5);
    noise(t,.05,vol*.25,1800,'bandpass',dest||bgm);
  }
  function noise(t,dur,vol,freq,type='bandpass',dest){
    const len=ctx.sampleRate*dur, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=.8;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfx); s.start(t);
    return {f,g};
  }
  function sched(){
    if (!ctx) return;
    while (nextT < ctx.currentTime + .25){
      const sc = SCALES[mode], tp = TEMPO[mode];
      if (mode==='battle'){
        if (step%4===0) buk(nextT,.55); else if (step%4===2) buk(nextT,.25);
        if (step%8===7) buk(nextT+tp/2,.3);
        if (Math.random()<.55){ idx=Math.max(0,Math.min(sc.length-1, idx+Math.round((Math.random()-.5)*4))); pluck(mtof(sc[idx]),nextT,.14,.9); }
      } else {
        const rest = mode==='tense'?.6:mode==='bright'?.3:.45;
        if (Math.random()>rest){
          idx=Math.max(0,Math.min(sc.length-1, idx+Math.round((Math.random()-.5)*4)));
          pluck(mtof(sc[idx]),nextT, mode==='tense'?.16:.2, mode==='tense'?2.6:2);
          if (Math.random()<.18) pluck(mtof(sc[Math.max(0,idx-2)]-12),nextT,.12,2.4);
        }
        if (mode==='tense' && step%16===0) buk(nextT,.18);
      }
      step++; nextT += tp * (mode==='battle'?1:(.85+Math.random()*.3));
    }
  }
  const api = {
    init,
    setMode(m){ if (mode!==m){ mode=m; idx=Math.floor(SCALES[m].length/2); } },
    toggle(){ on=!on; try{localStorage.setItem('sejong_sound',on?'on':'off');}catch(e){}
      if (master) master.gain.setTargetAtTime(on?.85:0, ctx.currentTime, .1); return on; },
    get on(){ return on; },
    play(name){
      if (!ctx || !on) return; const t = ctx.currentTime + .01;
      switch(name){
        case 'click': { const o=ctx.createOscillator(),g=ctx.createGain(); o.type='triangle'; o.frequency.value=900; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.07); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+.08); break; }
        case 'page': { const n=noise(t,.35,.25,2600,'bandpass'); n.f.frequency.exponentialRampToValueAtTime(900,t+.3); break; }
        case 'correct': [67,72,76,79].forEach((m,i)=>pluck(mtof(m),t+i*.07,.26,1.4,sfx)); break;
        case 'wrong': { const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(65,t+.35); f.type='lowpass'; f.frequency.value=500; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.connect(f); f.connect(g); g.connect(sfx); o.start(t); o.stop(t+.45); buk(t,.4,sfx); break; }
        case 'attack': { const n=noise(t,.35,.35,600,'highpass'); n.f.frequency.exponentialRampToValueAtTime(5000,t+.3); pluck(mtof(84),t+.12,.2,1,sfx); buk(t+.15,.5,sfx); break; }
        case 'defeat': [60,64,67,72,76,79,84].forEach((m,i)=>pluck(mtof(m),t+i*.06,.2,1.6,sfx)); break;
        case 'piece': { [72,76,79,84].forEach((m,i)=>{pluck(mtof(m),t+i*.12,.22,2.4,sfx);}); bell(t+.5,mtof(88),.12); break; }
        case 'gong': { [55,60.3,64.1,71.2].forEach((m,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=mtof(m-12); g.gain.setValueAtTime(.0,t); g.gain.linearRampToValueAtTime(.22/(i+1),t+.02); g.gain.exponentialRampToValueAtTime(.001,t+4); o.connect(g); g.connect(sfx); g.connect(revSend); o.start(t); o.stop(t+4.1);}); break; }
        case 'tick': { const n=noise(t,.03,.3,3000,'bandpass'); break; }
        case 'unlock': { noise(t,.05,.4,2500); noise(t+.12,.05,.4,1800); [72,79,84].forEach((m,i)=>pluck(mtof(m),t+.25+i*.08,.2,1.5,sfx)); break; }
        case 'shadow': { const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.linearRampToValueAtTime(55,t+1.5); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.4); g.gain.exponentialRampToValueAtTime(.001,t+2); o.connect(f); f.connect(g); g.connect(sfx); g.connect(revSend); o.start(t); o.stop(t+2.1); break; }
        case 'transform': { [48,55,60,64,67,72,76,79,84,88].forEach((m,i)=>pluck(mtof(m),t+i*.13,.2,3,sfx)); bell(t+1.4,mtof(84),.15); bell(t+1.6,mtof(91),.1); break; }
      }
    }
  };
  function bell(t,f,vol){ [1,2.76,5.4].forEach((r,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f*r; g.gain.setValueAtTime(vol/(i+1),t); g.gain.exponentialRampToValueAtTime(.001,t+2.5/(i+1)); o.connect(g); g.connect(sfx); g.connect(revSend); o.start(t); o.stop(t+2.6);}); }
  return api;
})();

(() => {
  const c = document.getElementById('fx'), x = c.getContext('2d'); let W,H,P=[];
  function rs(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  rs(); addEventListener('resize', rs);
  for (let i=0;i<46;i++) P.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.6,v:Math.random()*.35+.08,a:Math.random()*Math.PI*2,k:Math.random()<.18});
  (function loop(){
    x.clearRect(0,0,W,H);
    for (const p of P){
      p.y -= p.v; p.a += .01; p.x += Math.sin(p.a)*.25;
      if (p.y < -20){ p.y = H+20; p.x = Math.random()*W; }
      if (p.k){ x.save(); x.translate(p.x,p.y); x.rotate(Math.sin(p.a)*.6); x.fillStyle='rgba(220,200,160,.07)'; x.fillRect(-p.s*5,-p.s*3.5,p.s*10,p.s*7); x.restore(); }
      else { x.fillStyle=`rgba(255,${190+p.s*20|0},120,${.25+p.s*.12})`; x.beginPath(); x.arc(p.x,p.y,p.s,0,7); x.fill(); }
    }
    requestAnimationFrame(loop);
  })();
})();

function typewrite(el, lines, cb){
  let li=0, ci=0, timer=null, finished=false; const caret='<span class="caret"></span>';
  const ps = lines.map(l => { const p=document.createElement('p'); if (l.startsWith('!')) p.className='emph'; el.appendChild(p); return p; });
  const txt = lines.map(l => l.replace(/^!/,''));
  function tick(){
    if (li>=txt.length){ finish(); return; }
    const t = txt[li];
    if (ci < t.length){ ci = Math.min(t.length, ci+2); ps[li].innerHTML = esc(t.slice(0,ci)) + caret; timer=setTimeout(tick, 24); }
    else { ps[li].textContent = t; li++; ci=0; el.scrollTop = el.scrollHeight; timer=setTimeout(tick, t? 140 : 60); }
  }
  function finish(){ if (finished) return; finished=true; clearTimeout(timer); ps.forEach((p,i)=>p.textContent=txt[i]); cb && cb(); }
  tick();
  return {finish};
}

    if (!nm){ $('#ferr').textContent='이름을 입력해 주세요.'; fname.focus(); return; }
    Snd.init(); Snd.play('page');
    S = fresh(); S.id=id; S.name=nm; S.start=Date.now(); go(1);
  };
  $('#startBtn').onclick = start;
  fname.onkeydown = fid.onkeydown = e => { if (e.key==='Enter') start(); };
  if (prev) $('#resumeBtn').onclick = () => { Snd.init(); S = prev; go(S.step); };
}

function sM1(){
  const CARDS = [
    {n:1,t:'우리말은 있었지만, 이를 적을 우리 글자가 없었다.',b:'백'},
    {n:2,t:'한자를 모르는 백성들은 자기 뜻을 글로 나타내기 어려웠다.',b:'성'},
    {n:3,t:'세종은 이러한 백성들을 안타깝게 여겼다.',b:'을'},
    {n:4,t:'누구나 쉽게 익혀 쓸 수 있는 새 글자를 만들었다.',b:'위'},
    {n:5,t:'백성들이 자신의 생각을 글로 나타낼 수 있게 되었다.',b:'해'}
  ];
  let slots = [null,null,null,null,null], locked=[false,false,false,false,false], pool = shuffle(CARDS);
  stage.innerHTML = `<div class="mission fade-in">
    <div class="m-head"><span class="m-no">MISSION 1</span><span class="m-title">세종은 왜 글자를 만들었을까?</span></div>
    <p class="m-desc">훈민정음이 만들어지기까지의 사건 카드가 뒤죽박죽 섞여 있어요. 카드를 눌러 1번 칸부터 차례대로 놓으세요. 놓은 카드를 다시 누르면 빠져요.</p>
    <div class="paper m-panel"><div class="slots"></div><div class="pool"></div></div>
    <div class="m-foot"><span class="feedback" id="fb"></span><button class="btn primary" id="chk" disabled>순서 확인하기</button></div></div>`;
  const sEl = stage.querySelector('.slots'), pEl = stage.querySelector('.pool'), fb=$('#fb'), chk=$('#chk');
  const cardHTML = c => `<div class="ecard" data-n="${c.n}"><div class="in"><div class="f">${c.t}</div><div class="b">${c.b}</div></div></div>`;
  function draw(){
    sEl.innerHTML = slots.map((c,i)=>`<div class="slot" data-n="${i+1}">${c?cardHTML(c):''}</div>`).join('');
    sEl.querySelectorAll('.slot').forEach((s,i)=>{ const e=s.querySelector('.ecard'); if (e){ if (locked[i]) e.classList.add('lock'); e.onclick=()=>{ if(locked[i])return; Snd.play('click'); pool.push(slots[i]); slots[i]=null; draw(); }; } });
    pEl.innerHTML = pool.map(cardHTML).join('');
    pEl.querySelectorAll('.ecard').forEach((e,k)=>e.onclick=()=>{ const i=slots.indexOf(null); if(i<0)return; Snd.play('click'); slots[i]=pool.splice(k,1)[0]; draw(); });
    chk.disabled = slots.includes(null);
  }
  draw();
  chk.onclick = async () => {
    let right=0; slots.forEach((c,i)=>{ if (c.n===i+1){ right++; locked[i]=true; } });
    if (right===5){
      chk.disabled=true; Snd.play('correct'); fb.className='feedback'; fb.textContent='기억이 제자리를 찾았다! 카드 뒷면에 무언가가 떠오른다…';
      draw(); pEl.style.display='none';
      const es = sEl.querySelectorAll('.ecard');
      for (let i=0;i<es.length;i++){ await wait(380); es[i].classList.add('flip'); Snd.play('tick'); }
      await wait(900);
      chk.textContent='기억 조각 줍기'; chk.disabled=false;
      chk.onclick = () => getPiece(0, () => next());
    } else {
      Snd.play('wrong'); loseLamp();
      slots.forEach((c,i)=>{ if(!locked[i]){ pool.push(c); slots[i]=null; } });
      fb.className='feedback bad'; fb.textContent = right ? `${right}장이 제자리에 놓였어요(초록색). 나머지 카드를 다시 놓아 보세요.` : '제자리에 놓인 카드가 없어요. 일이 일어난 순서를 다시 떠올려 보세요.';
      stage.querySelector('.m-panel').classList.add('shake'); setTimeout(()=>stage.querySelector('.m-panel')?.classList.remove('shake'),500);
      draw();
    }
  };
}

function joinReply(a,b){
  a=a.trim(); b=b.trim();
  const last = a.charCodeAt(a.length-1);
  const hasN = last>=0xAC00 && last<=0xD7A3 && ((last-0xAC00)%28)===4;
  const A = !a ? '' : (hasN ? a : a+'한');
  const B = !b ? '' : (/(고|며)$/.test(b) ? b : b+'하고');
  return {A,B};
}

async function drawCert(cv){
  const W=1240, H=1754; cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try { await Promise.all(['80px "East Sea Dokdo"','800 40px "Nanum Myeongjo"','700 30px "Nanum Myeongjo"','30px "Gowun Batang"','700 30px "Gowun Batang"','900 40px "Noto Serif KR"'].map(f=>document.fonts.load(f, '세종훈민정음한글수호자탈출증서'))); } catch(e){}
  // 바탕
  let g=x.createRadialGradient(W/2,H*.4,100,W/2,H/2,H*.75); g.addColorStop(0,'#f4ead3'); g.addColorStop(.7,'#e6d4ae'); g.addColorStop(1,'#c9ad7c');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  for (let i=0;i<9000;i++){ x.fillStyle=`rgba(${100+Math.random()*60|0},${70+Math.random()*40|0},30,${Math.random()*.06})`; x.fillRect(Math.random()*W,Math.random()*H,Math.random()*3+1,Math.random()*3+1); }
  // 수호자 그림 (흐리게)
  await new Promise(r=>{ const im=new Image(); im.onload=()=>{ const s=900, o=document.createElement('canvas'); o.width=o.height=s; const ox=o.getContext('2d'); ox.drawImage(im,0,0,s,s);
      ox.globalCompositeOperation='destination-in'; const rg=ox.createRadialGradient(s/2,s/2,s*.15,s/2,s/2,s*.5); rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(1,'rgba(0,0,0,0)'); ox.fillStyle=rg; ox.fillRect(0,0,s,s);
      x.save(); x.globalAlpha=.13; x.drawImage(o,(W-s)/2,540); x.restore(); r(); }; im.onerror=r; im.src=IMG.guardian; });
  // 테두리
  x.strokeStyle='#7a5530'; x.lineWidth=6; x.strokeRect(60,60,W-120,H-120);
  x.strokeStyle='#9e1f1c'; x.lineWidth=2; x.strokeRect(84,84,W-168,H-168);
  x.strokeStyle='#b8925a'; x.lineWidth=1.5; x.strokeRect(96,96,W-192,H-192);
  [[84,84],[W-84,84],[84,H-84],[W-84,H-84]].forEach(([a,b])=>{ x.fillStyle='#9e1f1c'; x.beginPath(); x.moveTo(a,b-14); x.lineTo(a+14,b); x.lineTo(a,b+14); x.lineTo(a-14,b); x.fill(); });
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#7a5530'; x.font='700 30px "Nanum Myeongjo"'; x.fillText('한글날 기념 미니 방탈출 「세종의 편지」', W/2, 210);
  x.fillStyle='#1c120a'; fit(x,'탈출 성공 증서',190,'','"East Sea Dokdo"',W-260); x.fillText('탈출 성공 증서', W/2, 400);
  x.strokeStyle='#9e1f1c'; x.lineWidth=2; x.beginPath(); x.moveTo(300,450); x.lineTo(W-300,450); x.stroke();
  x.fillStyle='#2b1d12'; fit(x,`${S.id}   ${S.name}`,44,'700 ','"Gowun Batang"',W-300); x.fillText(`${S.id}   ${S.name}`, W/2, 540);
  x.font='32px "Gowun Batang"'; x.fillStyle='#3e2b18';
  const body = ['위 학생은 망각의 그림자가 남긴 네 가지 시험을 모두 통과하여','사라져 가던 훈민정음의 기억을 되찾고','그 뜻을 오늘에 이어 갈 답장을 세종에게 보냈기에','이 증서를 드립니다.'];
  body.forEach((l,i)=>x.fillText(l, W/2, 630+i*56));
  // 기억 조각
  x.fillStyle='#9e1f1c'; x.font='800 28px "Nanum Myeongjo"'; x.fillText('되찾은 네 개의 기억', W/2, 900);
  x.fillStyle='#2b1d12';
  PIECES.forEach((p,i)=>{ fit(x,p,70,'','"East Sea Dokdo"',W-300); x.fillText(p, W/2, 985+i*72); });
  // 답장
  const {A,B} = joinReply(S.reply[0]||'', S.reply[1]||'');
  x.fillStyle='rgba(158,31,28,.06)'; x.fillRect(170,1300,W-340,190); x.strokeStyle='#b8925a'; x.lineWidth=1.5; x.strokeRect(170,1300,W-340,190);
  x.fillStyle='#9e1f1c'; x.font='800 26px "Nanum Myeongjo"'; x.fillText('세종에게 보낸 나의 답장', W/2, 1350);
  x.fillStyle='#1c120a'; x.font='700 36px "Gowun Batang"';
  wrap(x, `“나는 ${A} 사람들을 위해 ${B} 싶다.”`, W/2, 1410, W-400, 48);
  // 날짜, 기록
  const d=new Date(S.end||Date.now());
  const dur = fmt(((S.end||Date.now())-S.start)/1000);

  x.font='800 36px "Nanum Myeongjo"'; x.fillStyle='#1c120a'; x.fillText('세종 · 한글의 수호자', W/2-70, 1620);
  // 인장
  x.save(); x.translate(W/2+170, 1605); x.rotate(.06);
  x.fillStyle='rgba(158,31,28,.88)'; x.fillRect(-56,-56,112,112);
  x.strokeStyle='#f4ead3'; x.lineWidth=3; x.strokeRect(-48,-48,96,96);
  x.fillStyle='#f4ead3'; x.font='900 38px "Noto Serif KR"'; x.textBaseline='middle';
  x.fillText('訓',-21,-21); x.fillText('民',21,-21); x.fillText('正',-21,23); x.fillText('音',21,23);
  x.restore();
  x.textBaseline='alphabetic';
}
function fit(x,t,size,pre,fam,maxW){ do { x.font=`${pre}${size}px ${fam}`; size-=2; } while (x.measureText(t).width>maxW && size>12); }
function wrap(x, t, cx, y, maxW, lh){
  const words=t.split(' '); let line='', lines=[];
  for (const w of words){ const tt=line?line+' '+w:w; if (x.measureText(tt).width>maxW && line){ lines.push(line); line=w; } else line=tt; }
  lines.push(line); lines=lines.slice(0,3);
  const off = (lines.length-1)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,cx,y+20-off+i*lh+ (lines.length===1?10:0)));
}
